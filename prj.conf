CONFIG_GPIO=y
CONFIG_PIO_RPI_PICO=y
# The application owns the DMA controller: the generic driver cannot chain blocks.
CONFIG_DMA=n
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=4096
# Emit machine telemetry in large batches rather than 30-byte printf fragments.
CONFIG_SHELL_PRINTF_BUFF_SIZE=512
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_BUILD_OUTPUT_UF2=y
# Keep capture/USB fault counters, but omit debug-only kernel assertions and
# spinlock ownership checks from the real-time audio build.
CONFIG_ASSERT=n
CONFIG_SPIN_VALIDATE=n

CONFIG_CRC=y

# Batch full-speed USB packets to reduce per-transfer workqueue overhead.
CONFIG_USBD_CDC_ACM_BUF_POOL=y
CONFIG_USBD_CDC_ACM_BUF_POOL_SIZE=1024
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_AUDIO2_CLASS=y

CONFIG_FPU=y
CONFIG_FPU_SHARING=y

CONFIG_FLASH=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_REBOOT=y
